<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Salão de Beleza</title>
</head>

<body>

    <h1>Salão de Beleza</h1>

    <h2>Agendamento</h2>

    <form>

        <label>Nome:</label>
        <input type="text" name="nome">

        <br><br>

        <label>Telefone:</label>
        <input type="tel" name="telefone">

        <br><br>

        <label>Serviço:</label>
        <select name="servico">
            <option>Selecione um serviço</option>
            <option>Cabeleireiro</option>
            <option>Manicure</option>
            <option>Designer de Sobrancelhas</option>
            <option>Depilador(a)</option>
        </select>

        <br><br>

        <label>Escolha o profissional:</label>
        <select name="profissional">
            <option>Selecione um profissional</option>
            <option>Yuri</option>
            <option>Juliana</option>
            <option>Israel</option>
            <option>Ismael</option>
            <option>Henry</option>
            <option>Rennan</option>
            <option>Diego</option>
            <option>Lucas</option>
            <option>Pereira</option>
        </select>

        <br><br>

        <label>Data:</label>
        <input type="date" name="data">

        <br><br>

        <label>Horário:</label>
        <input type="time" name="horario">

        <br><br>

        <label>Observação:</label>
        <br>
        <textarea name="observacao" rows="4" cols="30"></textarea>

        <br><br>

        <button type="submit">Agendar</button>

    </form>

</body>

</html>
